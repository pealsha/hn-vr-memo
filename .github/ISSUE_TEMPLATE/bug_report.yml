name: 不具合の報告 / Bug report
description: 動かない・意図と違う挙動を報告する（日本語・English OK）
body:
  - type: markdown
    attributes:
      value: |
        日本語・英語のどちらでも大丈夫です（English is welcome）。
        分からない項目は「不明」と書いてください。メモの内容やユーザー名などの個人情報は含めないでください。
  - type: textarea
    id: what-happened
    attributes:
      label: 起きたこと / What happened
      description: 期待した動きと、実際の動きを書いてください。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境 / Environment
      description: OS、HnMemo の版、HMD・コントローラー、SteamVR・接続方法など
      placeholder: |
        - OS: Windows 11 x64
        - HnMemo: v0.9.0
        - HMD / Controller: Meta Quest 3 / Touch Plus
        - Connection: Virtual Desktop / SteamVR
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Steps to reproduce
      description: 起きるまでの手順、毎回起きるか、表示されたエラーなど
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
