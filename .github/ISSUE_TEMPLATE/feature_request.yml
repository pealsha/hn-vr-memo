name: 要望・提案 / Feature request
description: 困っていることや改善の提案（日本語・English OK）
body:
  - type: markdown
    attributes:
      value: |
        日本語・英語のどちらでも大丈夫です（English is welcome）。
        案が固まっていなくても、困っている場面だけで構いません。
  - type: textarea
    id: problem
    attributes:
      label: 困っていること・やりたいこと / Problem or goal
      description: どんな場面で、何ができると助かりますか。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 提案や回避策 / Suggested change or workaround
      description: 希望する動きや、今使っている回避方法があれば書いてください（任意）。
    validations:
      required: false
